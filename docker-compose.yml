services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-atlas_dev}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-atlas_dev_password}
      POSTGRES_USER: ${DATABASE_USER:-atlas}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATABASE_USER:-atlas} -d ${DATABASE_NAME:-atlas_dev}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas-postgres-data:
